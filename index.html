<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>DesignForge V14.2</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css?v=14.2">
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand" id="homeBrand"><img src="logo.png" alt="DesignForge logo"><div><strong>DesignForge</strong><small>V14.2 • UI/UX Studio</small></div></div>
  <button id="homeBtn" class="top-home">⌂ Home</button>
  <button id="projectBtn" class="project">Untitled Project ▾</button>
  <div class="top-actions">
    <button id="undoBtn">↶</button><button id="redoBtn">↷</button>
    <button id="zoomOut">−</button><input id="zoomSlider" class="zoom-slider" type="range" min="25" max="300" step="1" value="100" aria-label="Canvas zoom"><span id="zoomValue">100%</span><button id="zoomIn">+</button>
    <button id="deviceBtn">▣ Devices</button><button id="layoutBtn">▤ Auto Layout</button><button id="prototypeBtn">⌁ Prototype</button>
    <button id="previewBtn" class="primary">▶ Preview</button>
    <button id="exportBtn" class="primary">⇩ Export</button>
    <button id="themeBtn">☾</button>
    <button id="mobileInspector" class="mobile-only">⚙</button><button id="touchModeBtn" class="mobile-only">☝ Touch</button>
  </div>
</header>

<div class="devicebar" id="devicebar">
  <span>Preview:</span>
  <button data-device="desktop" class="active">🖥 PC</button>
  <button data-device="tablet">▣ Tablet</button>
  <button data-device="mobile">📱 Phone</button>
  <button data-device="custom">↔ Custom</button>
  <span id="deviceSize">1440 × 900</span>
</div>

<div class="workspace">
  <aside class="leftnav">
    <button class="nav active" data-panel="home">⌂<small>Home</small></button>
    <button class="nav" data-panel="templates">▦<small>Templates</small></button>
    <button class="nav" data-panel="elements">◇<small>Elements</small></button>
    <button class="nav" data-panel="layers">☷<small>Layers</small></button>
    <button class="nav" data-panel="pages">▤<small>Pages</small></button>
    <button class="nav" data-panel="brand">◎<small>Brand</small></button>
    <button class="nav" data-panel="settings">⚙<small>Settings</small></button>
  </aside>

  <aside class="library" id="library"></aside>

  <main class="editor">
    <div class="editorbar">
      <button id="newCanvas">＋ New Canvas</button>
      <button id="newLayer">＋ New Layer</button><button id="groupBtn">◈ Group</button>
      <button id="gridBtn">▦ Grid</button>
      <button id="fitBtn">Fit</button><button id="resetWorkspaceBtn">Reset View</button>
      <span id="pageName">Home</span>
      <span class="hint">Touch + mouse supported</span>
    </div>
    <div class="viewport" id="viewport">
      <div id="canvasShell">
        <div id="canvas"><div id="objects"></div></div>
      </div>
    </div>
    <div class="mobile-actions"><button id="mobileHome">⌂</button><button id="mobileLayers">☷</button><button id="mobileAdd">＋</button><button id="mobilePreview">▶</button><button id="mobileExport">⇩</button></div><div class="bottom-tools">
      <button class="tool active" data-tool="select">↖ Select</button>
      <button class="tool" data-tool="text">T Text</button>
      <button class="tool" data-tool="shape">◇ Shape</button>
      <button class="tool" data-tool="card">▣ Card</button>
      <button class="tool" data-tool="button">▰ Button</button>
      <button class="tool" data-tool="image">▧ Image</button>
      <button class="tool" data-tool="frame">□ Frame</button>
      <button id="moreTools">••• More</button>
    </div>
  </main>

  <aside class="inspector" id="inspector">
    <div class="ins-head"><b>Design</b><button id="closeInspector">×</button></div>
    <div id="inspectorBody"></div>
  </aside>
</div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><b id="modalTitle">DesignForge</b><button id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>
<input id="imageInput" type="file" accept="image/*" hidden>
<input id="logoInput" type="file" accept="image/*" hidden>
<input id="projectInput" type="file" accept=".designforge,.json,application/json" hidden>
<script src="app.js?v=14.0"></script>
</body>
</html>
