<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>DesignForge V9</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><div><b>DesignForge</b><small>V9 • UI/UX Studio</small></div></div>
    <button class="project-name" id="projectNameBtn">Untitled Project ▾</button>
    <div class="top-actions">
      <button id="undoBtn" title="Undo">↶</button><button id="redoBtn" title="Redo">↷</button>
      <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
      <button id="previewBtn" class="accent">▶ Preview</button>
      <button id="themeBtn" title="Theme">☾</button>
      <button id="exportBtn">Export</button>
      <button id="mobileInspectorBtn" class="mobile-only">⚙</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <button class="side-item active" data-panel="home">⌂<span>Home</span></button>
      <button class="side-item" data-panel="templates">▦<span>Templates</span></button>
      <button class="side-item" data-panel="elements">◇<span>Elements</span></button>
      <button class="side-item" data-panel="text">T<span>Text</span></button>
      <button class="side-item" data-panel="images">▧<span>Images</span></button>
      <button class="side-item" data-panel="layers">☷<span>Layers</span></button>
      <button class="side-item" data-panel="pages">▤<span>Pages</span></button>
      <button class="side-item" data-panel="settings">⚙<span>Settings</span></button>
    </aside>

    <aside class="library" id="library"></aside>

    <main class="stage-wrap">
      <div class="stage-toolbar">
        <button id="newCanvasBtn" class="tool-main">＋ New</button>
        <button id="selectBtn" class="selected">↖ Select</button>
        <button id="gridBtn">▦ Grid</button>
        <button id="fitBtn">Fit</button>
        <button id="saveBtn">Save</button>
        <span class="stage-title" id="pageTitle">Home</span>
      </div>
      <div id="stageViewport" class="stage-viewport">
        <div id="canvasShadow" class="canvas-shadow">
          <div id="canvas" class="canvas">
            <div id="objects"></div>
          </div>
        </div>
      </div>
      <div class="bottom-toolbar">
        <button data-add="text">T Text</button><button data-add="shape">◇ Shape</button>
        <button data-add="card">▣ Card</button><button data-add="button">▰ Button</button>
        <button data-add="image">▧ Image</button><button data-add="frame">□ Frame</button>
        <button id="moreBtn">••• More</button>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <div class="inspector-head"><b>Inspector</b><button id="closeInspector">×</button></div>
      <div id="inspectorBody"></div>
    </aside>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><b id="modalTitle">Panel</b><button id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<div id="toast"></div>
<input id="imageInput" type="file" accept="image/*" hidden>
<input id="projectInput" type="file" accept=".designforge,.json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
