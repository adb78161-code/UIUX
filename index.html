<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>DesignForge V6 — UI/UX Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar glass">
    <div class="brand"><span class="brand-mark">◢</span><b>DesignForge</b><span class="version">V6</span></div>
    <div class="project-name"><span>▱</span><input id="projectName" value="Untitled Project" aria-label="Project name"><span id="saveState" class="saved">● Saved</span></div>
    <div class="top-actions">
      <button data-action="undo" title="Undo">↶</button>
      <button data-action="redo" title="Redo">↷</button>
      <button id="zoomBtn">100%⌄</button>
      <button data-action="preview" title="Preview">▷</button>
      <button data-action="theme" title="Theme">☾</button>
      <button class="export-btn" data-action="export">⇧ Export</button>
      <button id="helpBtn" class="avatar">?</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="left glass">
      <button class="nav active" data-panel="home">⌂<span>Home</span></button>
      <button class="nav" data-panel="templates">▦<span>Templates</span></button>
      <button class="nav" data-panel="elements">◆<span>Elements</span></button>
      <button class="nav" data-panel="text">T<span>Text</span></button>
      <button class="nav" data-panel="images">▧<span>Images</span></button>
      <button class="nav" data-panel="uploads">☁<span>Uploads</span></button>
      <button class="nav" data-panel="layers">▤<span>Layers</span></button>
      <button class="nav" data-panel="settings">⚙<span>Settings</span></button>
    </aside>

    <section class="center">
      <div class="canvas-head glass">
        <div><button id="newCanvas" class="small-btn">＋ New</button><button id="canvasType" class="small-btn">Website ▾</button></div>
        <div class="search"><span>⌕</span><input id="search" placeholder="Search anything..."></div>
        <div class="head-icons"><button data-action="grid">▦</button><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button></div>
      </div>

      <div id="canvasStage" class="stage">
        <div id="canvas" class="design-canvas" tabindex="0">
          <div class="empty-state" id="emptyState">
            <div class="plus">＋</div>
            <h2>Start Designing</h2>
            <p>Drag elements here or use the sidebar to add<br>shapes, text, images and more.</p>
          </div>
        </div>
      </div>

      <div class="bottom glass">
        <button class="tool active" data-tool="select">⌁<span>Select</span></button>
        <button class="tool" data-tool="move">✥<span>Move</span></button>
        <button class="tool" data-tool="text">T<span>Text</span></button>
        <button class="tool" data-tool="shape">●<span>Shape</span></button>
        <button class="tool" data-tool="image">▧<span>Image</span></button>
        <button class="tool" data-tool="frame">□<span>Frame</span></button>
        <button class="tool" data-tool="more">•••<span>More</span></button>
      </div>
    </section>

    <aside class="right glass">
      <div class="tabs"><button class="tab active">Design</button><button class="tab">Prototype</button><button class="tab">Comments</button></div>
      <div id="inspector">
        <div class="section"><div class="section-title">Position <span>⌃</span></div>
          <div class="two"><label>X<input id="propX" type="number" value="0"></label><label>Y<input id="propY" type="number" value="0"></label></div>
          <div class="aligns"><button data-align="left">⇤</button><button data-align="center">≡</button><button data-align="right">⇥</button><button data-align="top">⇡</button><button data-align="middle">↕</button><button data-align="bottom">⇣</button></div>
        </div>
        <div class="section"><div class="section-title">Size <span>⌃</span></div>
          <div class="two"><label>W<input id="propW" type="number" value="0"></label><label>H<input id="propH" type="number" value="0"></label></div>
        </div>
        <div class="section"><div class="section-title">Appearance <span>⌃</span></div>
          <label>Opacity <input id="opacity" type="range" min="0" max="100" value="100"><output id="opacityOut">100%</output></label>
          <label>Rotation <input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationOut">0°</output></label>
        </div>
        <div class="section"><div class="section-title">Fill <button id="addFill">＋</button></div>
          <div class="color-row"><input id="fillColor" type="color" value="#ffffff"><input id="fillHex" value="#ffffff"><span>100%</span></div>
        </div>
        <div class="section"><div class="section-title">Border <span>›</span></div><div class="two"><label>Width<input id="borderWidth" type="number" value="0" min="0"></label><label>Radius<input id="radius" type="number" value="24" min="0"></label></div></div>
        <div class="section"><div class="section-title">Shadow <span>›</span></div><label class="check"><input id="shadow" type="checkbox"> Soft shadow</label></div>
        <div class="section"><div class="section-title">Effects <span>›</span></div><label>Blur <input id="blur" type="range" min="0" max="30" value="0"></label></div>
        <div class="section actions"><button id="duplicate">Duplicate</button><button id="delete" class="danger">Delete</button></div>
      </div>
    </aside>
  </main>

  <div class="grid-control glass"><span>⌗ Grid</span><input id="gridToggle" type="checkbox" checked><select id="gridSize"><option>8px</option><option selected>16px</option><option>24px</option><option>32px</option></select></div>
  <div class="device-control glass"><button data-device="desktop" class="active">▣</button><button data-device="tablet">▯</button><button data-device="mobile">▥</button></div>

  <div id="panel" class="modal-panel glass hidden">
    <div class="panel-head"><h3 id="panelTitle">Templates</h3><button id="closePanel">×</button></div>
    <div id="panelBody"></div>
  </div>

  <input id="fileInput" type="file" accept="image/*" hidden>
  <div id="toast" class="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
