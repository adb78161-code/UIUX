<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>DesignForge V26 • Touch Editor DesignForge V23 • Professional Studio Layer Studio</title>
<link rel="stylesheet" href="style.css?v=25.0">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Home">
      <img id="brandLogo" src="logo.png" alt="DesignForge logo">
      <span class="brand-copy"><strong>DesignForge</strong><small>Professional Creative Studio</small></span>
    </button>
    <button class="create-top primary" id="createBtn">＋ Create</button>
    <button class="project-btn" id="projectBtn">Untitled Project <span>⌄</span></button>
    <div class="top-spacer"></div>
    <div class="top-actions">
      <button id="undoBtn" class="icon-btn" title="Undo">↶</button>
      <button id="redoBtn" class="icon-btn" title="Redo">↷</button>
      <div class="zoom-control" aria-label="Zoom">
        <button id="zoomOut" class="icon-btn">−</button>
        <input id="zoomSlider" type="range" min="25" max="300" value="100" step="1" aria-label="Canvas zoom">
        <span id="zoomValue">100%</span>
        <button id="zoomIn" class="icon-btn">＋</button>
      </div>
      <button id="previewBtn" class="primary">▶ Preview</button>
      <button id="exportBtn" class="primary">⇩ Export</button>
      <button id="moreTopBtn" class="icon-btn">•••</button>
    </div>
  </header>

  <div class="devicebar">
    <div class="device-label">Preview</div>
    <button data-device="desktop" class="device-chip active">🖥 PC <span>1440×900</span></button>
    <button data-device="tablet" class="device-chip">▣ Tablet <span>768×1024</span></button>
    <button data-device="mobile" class="device-chip">📱 Phone <span>390×844</span></button>
    <button data-device="custom" class="device-chip">↔ Canvas <span id="deviceSize">1100×700</span></button>
    <div class="device-fill"></div>
    <button id="fitBtn" class="compact-btn">Fit</button>
  </div>

  <div class="workspace">
    <aside class="left-rail" id="leftRail">
      <button class="rail-btn active" data-panel="home">⌂<span>Home</span></button>
      <button class="rail-btn" data-panel="templates">▦<span>Templates</span></button>
      <button class="rail-btn" data-panel="elements">◇<span>Elements</span></button>
      <button class="rail-btn" data-panel="stickers">✦<span>Stickers</span></button>
      <button class="rail-btn" data-panel="layers">☷<span>Layers</span></button>
      <button class="rail-btn" data-panel="pages">▤<span>Pages</span></button>
      <button class="rail-btn" data-panel="brand">◎<span>Brand</span></button>
      <button class="rail-btn" data-panel="styles">✧<span>Styles</span></button>
      <button class="rail-btn" data-panel="settings">⚙<span>Settings</span></button>
    </aside>

    <aside class="drawer library-drawer" id="libraryDrawer">
      <div class="drawer-head"><div><b id="drawerTitle">Design</b><small id="drawerDesc">Build your design</small></div><button class="icon-btn drawer-close" id="closeLibrary">×</button></div>
      <div id="libraryBody" class="drawer-body"></div>
    </aside>

    <main class="editor">
      <div class="editor-toolbar">
        <div class="toolbar-scroll">
          <button id="newCanvas" class="compact-btn">＋ New Canvas</button>
          <button id="newLayer" class="compact-btn">＋ Layer</button>
          <button id="groupBtn" class="compact-btn">◈ Group</button>
          <button id="layoutBtn" class="compact-btn">▤ Auto Layout</button>
          <button id="gridBtn" class="compact-btn">▦ Grid</button>
          <button id="snapBtn" class="compact-btn active-mini">⌁ Snap</button>
          <button id="resetViewBtn" class="compact-btn">Reset View</button>
        </div>
        <div class="editor-meta"><span id="pageName">Home</span><span id="status" class="status">● Saved</span></div>
      </div>

      <div class="viewport" id="viewport">
        <div class="stage-shadow"></div>
        <div id="canvasShell">
          <div id="canvas"><div id="objects"></div></div>
        </div>
        <div class="canvas-hud">
          <button id="hudZoomOut">−</button><span id="hudZoom">100%</span><button id="hudZoomIn">＋</button><button id="hudFit">Fit</button>
        </div>
        <div class="selection-tip">Drag • Resize • Rotate • Pinch to zoom</div>
      </div>

      <div class="mobile-dock" id="mobileDock">
        <button data-mobile="design">◇<span>Design</span></button>
        <button data-mobile="stickers">✦<span>Stickers</span></button>
        <button data-mobile="layers">☷<span>Layers</span></button>
        <button data-mobile="add" class="add-dock">＋<span>Add</span></button>
        <button data-mobile="edit">⚙<span>Edit</span></button>
      </div>

      <div class="tool-dock" id="toolDock">
        <button class="tool active" data-tool="select">↖ <span>Select</span></button>
        <button class="tool" data-tool="text">T <span>Text</span></button>
        <button class="tool" data-tool="shape">◇ <span>Shape</span></button>
        <button class="tool" data-tool="card">▣ <span>Card</span></button>
        <button class="tool" data-tool="button">▰ <span>Button</span></button>
        <button class="tool" data-tool="image">▧ <span>Image</span></button>
        <button class="tool" data-tool="sticker">✦ <span>Sticker</span></button>
        <button class="tool" data-tool="frame">□ <span>Frame</span></button>
        <button id="moreTools" class="tool">••• <span>More</span></button>
      </div>
    </main>

    <aside class="drawer inspector-drawer" id="inspectorDrawer">
      <div class="drawer-head"><div><b>Edit</b><small id="inspectorSub">No layer selected</small></div><button class="icon-btn drawer-close" id="closeInspector">×</button></div>
      <div id="inspectorBody" class="drawer-body"></div>
    </aside>
  </div>
</div>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><div><b id="modalTitle">DesignForge</b><small id="modalSubtitle"></small></div><button id="modalClose" class="icon-btn">×</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>
<div id="previewOverlay" class="preview-overlay hidden">
  <div class="preview-top"><b>Preview</b><button id="closePreview" class="icon-btn">×</button></div>
  <div id="previewViewport" class="preview-viewport"></div>
</div>
<div id="toast" role="status"></div>
<input id="imageInput" type="file" accept="image/*" hidden>
<input id="logoInput" type="file" accept="image/*" hidden>
<input id="projectInput" type="file" accept=".designforge,.json,application/json" hidden>
<script src="app.js?v=26.0"></script>
</body>
</html>
