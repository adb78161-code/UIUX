<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DesignForge</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<!-- LEFT SIDEBAR -->
<div class="sidebar glass">
  <button onclick="addText()">T</button>
  <button onclick="addBox()">⬛</button>
  <input type="file" id="imgUpload">
</div>

<!-- MAIN -->
<div class="main glass">
  <div class="topbar">
    <span>DesignForge</span>
    <button onclick="exportHTML()">Export</button>
  </div>

  <div id="canvas"></div>
</div>

<!-- RIGHT PANEL -->
<div class="right glass">
  <h3>Properties</h3>

  X: <input id="posX"><br>
  Y: <input id="posY"><br>
  W: <input id="width"><br>
  H: <input id="height"><br>

  Color: <input type="color" id="color"><br>
</div>

<!-- BOTTOM DOCK -->
<div class="dock glass">
  <button onclick="deleteEl()">Delete</button>
</div>

<script src="app.js"></script>
</body>
</html>
