<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DesignForge V8 PRO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
  <h2>DesignForge</h2>
  <button onclick="addBox()">Shape</button>
  <button onclick="addText()">Text</button>

</div>
