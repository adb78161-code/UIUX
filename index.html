<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UIX Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#111318;
    color:white;
    height:100vh;
    overflow:hidden;
}

/* APP */

.app{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:240px;
    background:#181b21;
    border-right:1px solid #292d35;
    padding:20px;
}

.logo{
    font-size:22px;
    font-weight:800;
    margin-bottom:25px;
}

.logo span{
    color:#7c5cff;
}

.section-title{
    font-size:12px;
    color:#858b98;
    margin:20px 0 10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.tool{
    width:100%;
    padding:11px 13px;
    margin-bottom:8px;
    border:0;
    border-radius:9px;
    background:#22262e;
    color:white;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.tool:hover{
    background:#303541;
}

.tool.active{
    background:#7c5cff;
}

/* TOP BAR */

.workspace{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:60px;
    background:#181b21;
    border-bottom:1px solid #292d35;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.project-name{
    font-weight:700;
}

.top-actions{
    display:flex;
    gap:10px;
}

.top-btn{
    border:0;
    background:#252932;
    color:white;
    padding:9px 15px;
    border-radius:8px;
    cursor:pointer;
}

.top-btn:hover{
    background:#333844;
}

.preview{
    background:#7c5cff;
}

/* CANVAS AREA */

.canvas-area{
    flex:1;
    position:relative;
    overflow:auto;
    background:
    radial-gradient(#292d35 1px,transparent 1px);
    background-size:20px 20px;
    padding:60px;
}

/* FRAME */

.frame{
    position:relative;
    width:390px;
    height:844px;
    margin:auto;
    background:white;
    border-radius:18px;
    box-shadow:0 20px 70px rgba(0,0,0,.45);
    overflow:hidden;
}

.frame.desktop{
    width:1000px;
    height:650px;
}

/* DESIGN ELEMENTS */

.element{
    position:absolute;
    cursor:move;
    user-select:none;
}

.element.selected{
    outline:2px solid #7c5cff;
    outline-offset:3px;
}

.text-element{
    color:#111;
    font-size:24px;
    font-weight:700;
}

.button-element{
    padding:13px 22px;
    background:#7c5cff;
    color:white;
    border-radius:10px;
    font-weight:600;
}

.card-element{
    width:260px;
    height:130px;
    border-radius:16px;
    background:#f3f3f3;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    padding:20px;
    color:#222;
}

.image-element{
    width:220px;
    height:150px;
    background:linear-gradient(135deg,#7c5cff,#ff5ca8);
    border-radius:14px;
}

/* PROPERTIES */

.properties{
    width:260px;
    background:#181b21;
    border-left:1px solid #292d35;
    padding:20px;
}

.properties h3{
    margin-bottom:20px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:12px;
    color:#8c92a0;
    margin-bottom:6px;
}

.field input,
.field select{
    width:100%;
    padding:9px;
    background:#242830;
    color:white;
    border:1px solid #343943;
    border-radius:7px;
}

.delete{
    width:100%;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#e5484d;
    color:white;
    cursor:pointer;
}

.empty{
    color:#777;
    font-size:13px;
}

/* PREVIEW */

.preview-mode .sidebar,
.preview-mode .topbar,
.preview-mode .properties{
    display:none;
}

.preview-mode .canvas-area{
    padding:0;
}

.preview-mode .frame{
    border-radius:0;
}

/* RESPONSIVE */

@media(max-width:900px){

    .sidebar{
        width:180px;
    }

    .properties{
        width:210px;
    }

}

@media(max-width:650px){

    .sidebar,
    .properties{
        display:none;
    }

    .canvas-area{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- LEFT TOOLBAR -->

<aside class="sidebar">

<div class="logo">
UI<span>X</span> Studio
</div>

<div class="section-title">
Insert
</div>

<button class="tool" onclick="addText()">
＋ Text
</button>

<button class="tool" onclick="addButton()">
＋ Button
</button>

<button class="tool" onclick="addCard()">
＋ Card
</button>

<button class="tool" onclick="addImage()">
＋ Image
</button>

<div class="section-title">
Frame
</div>

<button class="tool" onclick="setMobile()">
📱 Mobile
</button>

<button class="tool" onclick="setDesktop()">
🖥 Desktop
</button>

<div class="section-title">
Actions
</div>

<button class="tool" onclick="undo()">
↶ Undo
</button>

<button class="tool" onclick="saveDesign()">
💾 Save
</button>

<button class="tool" onclick="exportDesign()">
📤 Export
</button>

</aside>


<!-- MAIN -->

<main class="workspace">

<header class="topbar">

<div class="project-name">
My UI Project
</div>

<div class="top-actions">

<button class="top-btn" onclick="clearCanvas()">
Clear
</button>

<button class="top-btn preview"
onclick="togglePreview()">
Preview
</button>

</div>

</header>


<section class="canvas-area">

<div id="frame" class="frame">

</div>

</section>

</main>


<!-- RIGHT PROPERTIES -->

<aside class="properties">

<h3>
Properties
</h3>

<div id="propertyPanel">

<div class="empty">
Select an element to edit its properties.
</div>

</div>

</aside>

</div>


<script>

let frame = document.getElementById("frame");

let selected = null;

let history = [];

let elementCount = 0;


/* SAVE HISTORY */

function saveHistory(){

    history.push(frame.innerHTML);

}


/* CREATE ELEMENT */

function createElement(type){

    saveHistory();

    elementCount++;

    let el = document.createElement("div");

    el.classList.add("element");

    el.dataset.id = elementCount;

    el.style.left = "50px";

    el.style.top = (50 + elementCount * 20) + "px";


    if(type === "text"){

        el.classList.add("text-element");

        el.innerText = "Your Heading";

    }


    if(type === "button"){

        el.classList.add("button-element");

        el.innerText = "Button";

    }


    if(type === "card"){

        el.classList.add("card-element");

        el.innerHTML = `
        <strong>Card Title</strong>
        <br><br>
        Your card content
        `;

    }


    if(type === "image"){

        el.classList.add("image-element");

    }


    frame.appendChild(el);

    selectElement(el);

    makeDraggable(el);

}


/* BUTTONS */

function addText(){

    createElement("text");

}

function addButton(){

    createElement("button");

}

function addCard(){

    createElement("card");

}

function addImage(){

    createElement("image");

}


/* SELECT */

function selectElement(el){

    if(selected){

        selected.classList.remove("selected");

    }

    selected = el;

    selected.classList.add("selected");

    showProperties();

}


/* PROPERTIES */

function showProperties(){

    if(!selected){

        return;

    }

    let panel =
    document.getElementById("propertyPanel");

    panel.innerHTML = `

    <div class="field">

    <label>X Position</label>

    <input type="number"
    value="${parseInt(selected.style.left)}"
    onchange="updatePosition('x',this.value)">

    </div>


    <div class="field">

    <label>Y Position</label>

    <input type="number"
    value="${parseInt(selected.style.top)}"
    onchange="updatePosition('y',this.value)">

    </div>


    <div class="field">

    <label>Width</label>

    <input type="number"
    value="${selected.offsetWidth}"
    onchange="updateSize('width',this.value)">

    </div>


    <div class="field">

    <label>Height</label>

    <input type="number"
    value="${selected.offsetHeight}"
    onchange="updateSize('height',this.value)">

    </div>


    <div class="field">

    <label>Background</label>

    <input type="color"
    onchange="updateColor(this.value)">

    </div>


    <div class="field">

    <label>Text</label>

    <input type="text"
    value="${selected.innerText}"
    onchange="updateText(this.value)">

    </div>


    <button class="delete"
    onclick="deleteElement()">

    Delete Element

    </button>

    `;

}


/* UPDATE POSITION */

function updatePosition(axis,value){

    if(!selected) return;

    saveHistory();

    if(axis === "x"){

        selected.style.left = value + "px";

    }

    else{

        selected.style.top = value + "px";

    }

}


/* SIZE */

function updateSize(type,value){

    if(!selected) return;

    saveHistory();

    selected.style[type] = value + "px";

}


/* COLOR */

function updateColor(color){

    if(!selected) return;

    saveHistory();

    selected.style.background = color;

}


/* TEXT */

function updateText(text){

    if(!selected) return;

    saveHistory();

    selected.innerText = text;

}


/* DELETE */

function deleteElement(){

    if(!selected) return;

    saveHistory();

    selected.remove();

    selected = null;

    document.getElementById(
        "propertyPanel"
    ).innerHTML =
    `<div class="empty">
    Select an element to edit its properties.
    </div>`;

}


/* DRAG */

function makeDraggable(el){

    let offsetX;

    let offsetY;

    let dragging = false;


    el.addEventListener(
        "mousedown",
        startDrag
    );


    el.addEventListener(
        "touchstart",
        startDrag,
        {passive:false}
    );


    function startDrag(e){

        e.preventDefault();

        selectElement(el);

        dragging = true;

        let point =
        e.touches ?
        e.touches[0] :
        e;

        let rect =
        el.getBoundingClientRect();

        offsetX =
        point.clientX - rect.left;

        offsetY =
        point.clientY - rect.top;


        document.addEventListener(
            "mousemove",
            drag
        );

        document.addEventListener(
            "mouseup",
            stopDrag
        );

        document.addEventListener(
            "touchmove",
            drag,
            {passive:false}
        );

        document.addEventListener(
            "touchend",
            stopDrag
        );

    }


    function drag(e){

        if(!dragging) return;

        e.preventDefault();

        let point =
        e.touches ?
        e.touches[0] :
        e;

        let frameRect =
        frame.getBoundingClientRect();

        let x =
        point.clientX -
        frameRect.left -
        offsetX;

        let y =
        point.clientY -
        frameRect.top -
        offsetY;


        el.style.left =
        Math.max(0,x) + "px";

        el.style.top =
        Math.max(0,y) + "px";

    }


    function stopDrag(){

        dragging = false;

        document.removeEventListener(
            "mousemove",
            drag
        );

        document.removeEventListener(
            "mouseup",
            stopDrag
        );

        document.removeEventListener(
            "touchmove",
            drag
        );

        document.removeEventListener(
            "touchend",
            stopDrag
        );

    }

}


/* FRAME */

function setMobile(){

    frame.classList.remove("desktop");

}

function setDesktop(){

    frame.classList.add("desktop");

}


/* CLEAR */

function clearCanvas(){

    if(confirm("Clear entire design?")){

        saveHistory();

        frame.innerHTML = "";

        selected = null;

    }

}


/* UNDO */

function undo(){

    if(history.length === 0) return;

    frame.innerHTML =
    history.pop();

    selected = null;

    document.getElementById(
        "propertyPanel"
    ).innerHTML =
    `<div class="empty">
    Select an element to edit its properties.
    </div>`;


    frame
    .querySelectorAll(".element")
    .forEach(makeDraggable);

}


/* SAVE */

function saveDesign(){

    localStorage.setItem(
        "uixDesign",
        frame.innerHTML
    );

    alert("Design saved!");

}


/* LOAD */

function loadDesign(){

    let design =
    localStorage.getItem(
        "uixDesign"
    );

    if(design){

        frame.innerHTML = design;

        frame
        .querySelectorAll(".element")
        .forEach(makeDraggable);

    }

}


/* EXPORT */

function exportDesign(){

    let data = {

        html: frame.innerHTML,

        width:
        frame.offsetWidth,

        height:
        frame.offsetHeight

    };


    let blob =
    new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );


    let url =
    URL.createObjectURL(blob);

    let a =
    document.createElement("a");

    a.href = url;

    a.download =
    "my-ui-design.json";

    a.click();

    URL.revokeObjectURL(url);

}


/* PREVIEW */

function togglePreview(){

    document.body.classList.toggle(
        "preview-mode"
    );

}


/* CLICK FRAME */

frame.addEventListener(
    "click",
    function(e){

        if(e.target === frame){

            if(selected){

                selected.classList.remove(
                    "selected"
                );

            }

            selected = null;

        }

    }
);


/* LOAD */

loadDesign();

</script>

</body>
</html>
